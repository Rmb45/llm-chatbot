# Model Configuration
model:
  vocab_size: 10000
  max_seq_length: 512
  d_model: 512
  num_layers: 6
  num_heads: 8
  d_ff: 2048
  dropout: 0.1
  
# Training Configuration
training:
  batch_size: 32
  learning_rate: 0.0001
  epochs: 10
  warmup_steps: 4000
  max_grad_norm: 1.0
  save_every: 500  # Save checkpoint every N batches
  log_every: 100   # Log metrics every N batches
  
# Data Configuration
data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  num_workers: 4
  
# Device
device: cuda  # Use 'cuda' for GPU, 'cpu' for CPU
